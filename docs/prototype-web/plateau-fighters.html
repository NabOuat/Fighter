<title>Plateau Fighters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one arcade screen, 384x216 pixel canvas scaled up; touch controls float over it (landscape) or sit under it (portrait). Single dark look by choice. */
:root{
  --bg:#0b0710; --ink:#f4ead2; --hot:#ff4f2e; --gold:#ffc23d; --cool:#3fe0d0; --plum:#2a1838; --line:#140c18;
  --px:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --st:clamp(112px,30vmin,168px); --b:clamp(58px,16vmin,84px);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--px);overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
body.portrait #app{justify-content:flex-start}
#rot{display:none;font-size:9px;line-height:1.8;color:#a99bb3;text-align:center;padding:12px 16px 0;letter-spacing:.04em}
body.portrait #rot{display:block}

#ctl{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
body.touch[data-mode="fight"] #ctl, body.touch[data-mode="intro"] #ctl, body.touch[data-mode="ko"] #ctl{display:block}
#pad{position:absolute;left:0;bottom:0;width:50%;height:62%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:var(--st);height:var(--st);border-radius:50%;background:rgba(20,12,24,.42);border:3px solid rgba(244,234,210,.28)}
#stick::before,#stick::after{content:"";position:absolute;background:rgba(244,234,210,.16)}
#stick::before{left:50%;top:12%;bottom:12%;width:3px;margin-left:-1.5px}
#stick::after{top:50%;left:12%;right:12%;height:3px;margin-top:-1.5px}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
  background:rgba(244,234,210,.62);border:3px solid var(--line);z-index:1}
#btns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:calc(var(--b) * 2.35);height:calc(var(--b) * 2.15);pointer-events:none}
.bt{position:absolute;width:var(--b);height:var(--b);pointer-events:auto;touch-action:none;border:0;padding:0;
  font-family:var(--px);color:var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);opacity:.86;cursor:pointer}
.bt b{font-size:calc(var(--b) * .3);line-height:1}
.bt span{font-size:7px;letter-spacing:.06em}
.bt.on{transform:scale(.9);opacity:1;filter:brightness(1.25)}
#bP{left:0;bottom:0;background:var(--gold)}
#bK{right:0;bottom:calc(var(--b) * .38);background:var(--hot)}
#bS{left:calc(var(--b) * .42);top:0;background:#5d566a;color:#c9c0d2}
#bS.ready{background:var(--cool);color:var(--line);animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
@media (prefers-reduced-motion:reduce){#bS.ready{animation:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Plateau Fighters, jeu de combat"></canvas>
  <p id="rot">Tourne ton téléphone<br>pour jouer en grand</p>
</div>
<div id="ctl">
  <div id="pad"><div id="stick"><div id="knob"></div></div></div>
  <div id="btns">
    <button class="bt" id="bP" data-b="p"><b>P</b><span>POING</span></button>
    <button class="bt" id="bK" data-b="k"><b>K</b><span>PIED</span></button>
    <button class="bt" id="bS" data-b="s"><b>S</b><span>SPECIAL</span></button>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const W=384,H=216,FLOOR=196,SW=560;
const cv=$('#cv'),g=cv.getContext('2d');cv.width=W;cv.height=H;g.imageSmoothingEnabled=false;
const C={ink:'#f4ead2',hot:'#ff4f2e',gold:'#ffc23d',cool:'#3fe0d0',dark:'#140c18',plum:'#2a1838',dim:'#a99bb3'};
const OUT='#140c18';
const FONT='"Press Start 2P", ui-monospace, "Courier New", monospace';
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function txt(s,x,y,size=8,col=C.ink,align='left',out=OUT){
  g.font=size+'px '+FONT;g.textAlign=align;g.textBaseline='top';
  if(out){const o=size>=16?2:1;g.fillStyle=out;for(const[dx,dy]of[[-o,0],[o,0],[0,-o],[0,o],[o,o]])g.fillText(s,Math.round(x+dx),Math.round(y+dy))}
  g.fillStyle=col;g.fillText(s,Math.round(x),Math.round(y));
}

/* ---------- Roster ---------- */
const ROSTER=[
 {name:'KENJI',quarter:'YOPOUGON',skin:'#e2a878',skinD:'#b5774c',hair:'#1b1414',hairStyle:'spike',gi:'#efe8d8',giD:'#b8ae9a',sleeve:'gi',
  belt:'#1c1620',band:'#e8322b',glove:'#e8322b',gloveD:'#a51f1b',boot:'#e2a878',bootD:'#b5774c',speed:1.5,power:1,hp:100,
  special:'fireball',specialName:'ONDE BLEUE',fx:['#2fd3ff','#c9f6ff']},
 {name:'AWA',quarter:'COCODY',skin:'#8a5532',skinD:'#5f3720',hair:'#120b08',hairStyle:'bun',gi:'#ff7a1a',giD:'#c4520c',sleeve:'skin',
  belt:'#3fe0d0',band:'#3fe0d0',glove:'#ffd54a',gloveD:'#c99a1c',boot:'#2b1d2e',bootD:'#1a111c',speed:1.95,power:.85,hp:90,
  special:'dash',specialName:'TORNADE',fx:['#3fe0d0','#e9fffb']},
 {name:'BAKO',quarter:'TREICHVILLE',skin:'#5e3b24',skinD:'#3f2616',hair:'#0f0a07',hairStyle:'bald',gi:'#2f8f4e',giD:'#1d5e32',sleeve:'skin',
  belt:'#ffc23d',band:null,glove:'#3c3c4a',gloveD:'#26262f',boot:'#1b1b22',bootD:'#101015',speed:1.2,power:1.25,hp:115,
  special:'quake',specialName:'SEISME',fx:['#ffc23d','#a8642a'],big:true},
];

/* ---------- Poses (x forward, y up negative, feet at 0) ---------- */
const KEYS=['hip','neck','kF','fF','kB','fB','eF','hF','eB','hB','hd'];
const mk=o=>{if(!o.hd)o.hd=[o.neck[0]+1,o.neck[1]-1];return o};
const AR={eF:[9,-30],hF:[12,-37],eB:[4,-29],hB:[8,-34]};
const LEGS={hip:[0,-22],kF:[6,-11],fF:[9,0],kB:[-4,-11],fB:[-8,0]};
const PO={
 idle:mk({...LEGS,neck:[2,-38],...AR}),
 walkA:mk({hip:[0,-22],neck:[3,-38],kF:[9,-12],fF:[13,-1],kB:[-5,-10],fB:[-11,0],...AR}),
 walkB:mk({hip:[0,-23],neck:[2,-39],kF:[3,-12],fF:[1,-2],kB:[1,-12],fB:[-2,0],...AR}),
 crouch:mk({hip:[-1,-12],neck:[4,-27],kF:[9,-12],fF:[9,0],kB:[-4,-8],fB:[-10,0],eF:[10,-20],hF:[13,-26],eB:[6,-19],hB:[10,-23]}),
 punch:mk({hip:[1,-22],neck:[5,-38],kF:[7,-11],fF:[11,0],kB:[-4,-11],fB:[-9,0],eF:[14,-36],hF:[24,-37],eB:[1,-30],hB:[5,-34]}),
 kick:mk({hip:[-1,-23],neck:[-5,-38],kF:[11,-28],fF:[25,-31],kB:[-3,-11],fB:[-4,0],eF:[2,-31],hF:[7,-36],eB:[-9,-31],hB:[-13,-35]}),
 cpunch:mk({hip:[0,-12],neck:[6,-26],kF:[9,-12],fF:[9,0],kB:[-4,-8],fB:[-10,0],eF:[15,-23],hF:[23,-24],eB:[4,-19],hB:[8,-22]}),
 sweep:mk({hip:[-2,-10],neck:[-6,-24],kF:[12,-5],fF:[27,-2],kB:[-5,-7],fB:[-7,0],eF:[-1,-16],hF:[3,-4],eB:[-10,-17],hB:[-14,-12]}),
 jump:mk({hip:[0,-26],neck:[2,-42],kF:[9,-22],fF:[5,-14],kB:[-3,-18],fB:[-9,-12],eF:[9,-35],hF:[12,-41],eB:[4,-34],hB:[8,-39]}),
 jpunch:mk({hip:[0,-26],neck:[4,-42],kF:[9,-22],fF:[5,-14],kB:[-3,-18],fB:[-9,-12],eF:[13,-37],hF:[22,-33],eB:[0,-35],hB:[4,-38]}),
 jkick:mk({hip:[0,-26],neck:[-3,-41],kF:[12,-20],fF:[23,-12],kB:[-3,-20],fB:[-9,-15],eF:[3,-35],hF:[8,-40],eB:[-6,-35],hB:[-10,-39]}),
 guard:mk({hip:[-1,-22],neck:[-1,-38],kF:[5,-11],fF:[8,0],kB:[-5,-11],fB:[-9,0],eF:[8,-34],hF:[7,-42],eB:[6,-32],hB:[6,-40]}),
 cguard:mk({hip:[-2,-12],neck:[1,-27],kF:[8,-12],fF:[8,0],kB:[-5,-8],fB:[-10,0],eF:[8,-22],hF:[7,-30],eB:[6,-20],hB:[6,-28]}),
 hit:mk({hip:[-2,-22],neck:[-7,-37],kF:[4,-11],fF:[8,0],kB:[-6,-11],fB:[-10,0],eF:[-2,-30],hF:[3,-26],eB:[-9,-31],hB:[-14,-34]}),
 fall:mk({hip:[0,-24],neck:[-12,-33],kF:[8,-22],fF:[15,-17],kB:[5,-18],fB:[12,-13],eF:[-10,-37],hF:[-16,-41],eB:[-15,-32],hB:[-21,-34],hd:[-15,-32]}),
 down:mk({hip:[0,-3],neck:[-15,-4],kF:[7,-7],fF:[16,-2],kB:[6,-3],fB:[15,-1],eF:[-8,-7],hF:[-2,-3],eB:[-18,-3],hB:[-24,-2],hd:[-20,0]}),
 charge:mk({hip:[-1,-22],neck:[-2,-38],kF:[6,-11],fF:[10,0],kB:[-5,-11],fB:[-10,0],eF:[-4,-30],hF:[-6,-26],eB:[-6,-29],hB:[-8,-25]}),
 special:mk({hip:[1,-21],neck:[5,-36],kF:[9,-11],fF:[14,0],kB:[-5,-10],fB:[-12,0],eF:[13,-31],hF:[22,-31],eB:[11,-29],hB:[20,-28]}),
 slamUp:mk({...LEGS,hip:[0,-23],neck:[1,-39],eF:[5,-47],hF:[3,-55],eB:[-1,-47],hB:[-1,-55]}),
 slamDown:mk({hip:[-1,-14],neck:[7,-28],kF:[10,-12],fF:[11,0],kB:[-5,-8],fB:[-11,0],eF:[12,-15],hF:[16,-3],eB:[9,-14],hB:[12,-3]}),
 win:mk({...LEGS,neck:[1,-38],eF:[7,-45],hF:[6,-54],eB:[3,-29],hB:[7,-34]}),
};
function lerpP(a,b,k){k=clamp(k,0,1);const o={};for(const n of KEYS)o[n]=[a[n][0]+(b[n][0]-a[n][0])*k,a[n][1]+(b[n][1]-a[n][1])*k];return o}
function shiftY(p,dy){const o={};for(const n of KEYS)o[n]=[p[n][0],p[n][1]+(n[0]==='f'||n[0]==='k'?0:dy)];return o}

/* ---------- Pixel fighter renderer ---------- */
function seg(ax,ay,bx,by,w,c){
  g.fillStyle=c;const dx=bx-ax,dy=by-ay,n=Math.max(1,Math.ceil(Math.hypot(dx,dy))),h=Math.floor(w/2);
  for(let i=0;i<=n;i++)g.fillRect(Math.round(ax+dx*i/n)-h,Math.round(ay+dy*i/n)-h,w,w);
}
function limb(pts,w,c){
  for(let i=0;i<pts.length-1;i++)seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],w+2,OUT);
  for(let i=0;i<pts.length-1;i++)seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],w,c);
}
function drawHead(d,x,y,face,fl){
  const px=(dx,dy,w,h,c)=>R(face>0?x+dx:x-dx-w,y+dy,w,h,c);
  const sk=fl?'#fff':d.skin,hr=fl?'#fff':d.hair,sd=fl?'#fff':d.skinD;
  px(-5,-11,10,11,OUT);px(-4,-10,8,9,sk);px(-4,-2,8,1,sd);
  if(d.hairStyle==='spike'){px(-5,-13,3,3,OUT);px(-2,-13,3,2,OUT);px(-4,-12,2,2,hr);px(-1,-12,2,1,hr);px(-4,-10,8,2,hr);px(-4,-8,2,3,hr)}
  if(d.hairStyle==='bun'){px(-9,-12,5,6,OUT);px(-8,-11,3,4,hr);px(-4,-10,8,2,hr);px(-4,-8,1,5,hr)}
  if(d.hairStyle==='bald'){px(-4,-10,8,1,sd);px(-1,-10,2,1,fl?'#fff':'#8a6448');px(-1,-4,5,3,hr);px(-4,-8,1,3,sd)}
  if(d.band){const b=fl?'#fff':d.band;px(-4,-8,8,1,b);px(-7,-8,3,1,b);px(-9,-7,2,1,b)}
  px(2,-7,2,1,hr);px(2,-6,1,2,OUT);
}
function drawFighter(d,pose,ox,oy,face,fl){
  const s=d.big?1.12:1;
  const P=n=>[Math.round(ox+pose[n][0]*face*s),Math.round(oy+pose[n][1]*s)];
  const col=k=>fl?'#ffffff':d[k];
  const lw=Math.round(5*s),tw=Math.round(10*s);
  const hip=P('hip'),neck=P('neck');
  const glove=(p,c)=>{R(p[0]-3,p[1]-3,6,6,OUT);R(p[0]-2,p[1]-2,4,4,c)};
  const boot=(p,c)=>{const x=face>0?p[0]-2:p[0]-5;R(x-1,p[1]-3,9,4,OUT);R(x,p[1]-2,7,2,c)};
  limb([neck,P('eB'),P('hB')],lw-1,col(d.sleeve+'D'));glove(P('hB'),col('gloveD'));
  limb([hip,P('kB'),P('fB')],lw,col('giD'));boot(P('fB'),col('bootD'));
  limb([hip,neck],tw,col('gi'));
  if(d.sleeve==='skin'&&!fl){seg(neck[0],neck[1]+2,neck[0]+face,neck[1]+3,3,d.skin)}
  const bx=hip[0]-Math.floor(tw/2);R(bx-1,hip[1]-3,tw+2,4,OUT);R(bx,hip[1]-2,tw,2,col('belt'));R(face>0?bx-2:bx+tw,hip[1]-1,2,3,col('belt'));
  limb([hip,P('kF'),P('fF')],lw,col('gi'));boot(P('fF'),col('boot'));
  const hd=P('hd');drawHead(d,hd[0],hd[1],face,fl);
  limb([neck,P('eF'),P('hF')],lw-1,col(d.sleeve));glove(P('hF'),col('glove'));
}

/* ---------- Attacks ---------- */
const ATK={
 punch:{su:4,ac:3,re:9,dmg:6,box:[4,-42,22,9],hs:14,bs:9,push:2.2,h:'mid',pose:'punch',base:'idle'},
 kick:{su:7,ac:4,re:15,dmg:9,box:[4,-36,26,12],hs:17,bs:11,push:3,h:'mid',pose:'kick',base:'idle'},
 cpunch:{su:4,ac:3,re:9,dmg:5,box:[4,-28,22,9],hs:13,bs:8,push:2,h:'mid',pose:'cpunch',base:'crouch',crouch:1},
 sweep:{su:8,ac:4,re:20,dmg:8,box:[2,-9,28,9],hs:20,bs:12,push:2,h:'low',kd:1,pose:'sweep',base:'crouch',crouch:1},
 jpunch:{su:3,ac:40,re:0,dmg:7,box:[0,-40,20,14],hs:16,bs:9,push:1.5,h:'high',pose:'jpunch',air:1},
 jkick:{su:4,ac:40,re:0,dmg:9,box:[0,-24,24,14],hs:18,bs:10,push:2,h:'high',pose:'jkick',air:1},
 fireball:{su:13,ac:1,re:24,kind:'fireball'},
 dash:{su:7,ac:22,re:14,kind:'dash',dmg:12,box:[-6,-42,30,38],hs:20,bs:14,push:3.2,h:'mid',kd:1},
 quake:{su:18,ac:1,re:22,kind:'quake'},
};

/* ---------- Audio ---------- */
let AC=null,muted=false,NB=null;
function ainit(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f0,f1,d,type='square',v=.15,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.2,f=1200,q=1){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const t=AC.currentTime,s=AC.createBufferSource(),bf=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NB;bf.type='bandpass';bf.frequency.value=f;bf.Q.value=q;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(bf).connect(gn).connect(AC.destination);s.start(t);s.stop(t+d)}
const SFX={
 whoosh:()=>noise(.08,.07,2400,.8),
 hit:()=>{noise(.09,.35,900);tone(200,70,.1,'square',.12)},
 hit2:()=>{noise(.16,.45,600);tone(150,40,.18,'square',.16)},
 block:()=>{tone(1100,700,.06,'square',.07);noise(.05,.15,3000)},
 jump:()=>tone(300,520,.08,'triangle',.08),
 special:()=>tone(220,660,.25,'sawtooth',.1),
 nope:()=>tone(160,120,.08,'square',.05),
 thud:()=>{noise(.2,.4,200);tone(90,40,.2,'sine',.25)},
 ko:()=>{tone(400,40,.9,'sawtooth',.15);noise(.5,.3,400)},
 sel:()=>tone(880,880,.05,'square',.06),
 go:()=>{tone(523,523,.1,'square',.08);tone(784,784,.2,'square',.08,.1)},
 bell:()=>tone(1320,1300,.6,'triangle',.12),
};
const sfx=n=>SFX[n]&&SFX[n]();

/* ---------- State ---------- */
let F=[],projs=[],parts=[],ai=null,camX=(SW-W)/2,fr=0,hitstop=0,shake=0,pid=0;
const game={mode:'title',sel:0,diff:1,round:1,timer:0,it:0,kt:0,winner:null,hype:0,combo:null,paused:false,prev:'fight'};
let UI=[];

class Fighter{
  constructor(def,side,isAI){this.def=def;this.side=side;this.isAI=isAI;this.wins=0;this.meter=50;this.atkId=0;this.jumpId=0;this.reset()}
  reset(){this.x=SW/2+(this.side===0?-56:56);this.y=FLOOR;this.vx=0;this.vy=0;this.face=this.side===0?1:-1;
    this.hp=this.maxhp=this.def.hp;this.trail=this.hp;this.state='idle';this.st=0;this.t=Math.random()*40|0;this.atk=null;this.ast=0;
    this.hitDone=false;this.stun=0;this.cg=false;this.inv=0;this.flash=0;this.buf=null;this.combo=0;this.airUsed=false;this.callout=null;this.vflip=false;
    this.inp={l:0,r:0,u:0,d:0,p:0,k:0,s:0}}
  get s(){return this.def.big?1.12:1}
}
const FREE=['idle','walk','crouch'];
function setState(f,s){f.state=s;f.st=0}
function startAtk(f,name){const A=ATK[name];f.atk=A;f.hitDone=false;f.atkId++;setState(f,'attack');f.vx=0;if(!A.kind)sfx('whoosh')}

function updateFighter(f,op){
  const I=f.inp;f.t++;f.st++;if(f.inv>0)f.inv--;if(f.flash>0)f.flash--;
  if(f.buf&&--f.buf.t<=0)f.buf=null;
  for(const b of['p','k','s'])if(I[b])f.buf={b,t:8};
  const toward=op.x>f.x?1:-1,dirX=(I.r?1:0)-(I.l?1:0);
  if(FREE.includes(f.state)&&f.y>=FLOOR){
    f.face=toward;
    if(f.buf){const b=f.buf.b;f.buf=null;
      if(b==='s'){if(f.meter>=50){f.meter-=50;startAtk(f,f.def.special);f.callout={text:f.def.specialName,t:55};sfx('special')}else sfx('nope')}
      else startAtk(f,I.d?(b==='p'?'cpunch':'sweep'):(b==='p'?'punch':'kick'));}
    if(FREE.includes(f.state)){
      if(I.u){setState(f,'jump');f.vy=-5.4;f.vx=dirX*f.def.speed*1.15;f.atk=null;f.airUsed=false;f.jumpId++;sfx('jump')}
      else if(I.d){if(f.state!=='crouch')setState(f,'crouch');f.vx=0}
      else if(dirX){if(f.state!=='walk')setState(f,'walk');f.vx=dirX*f.def.speed*(dirX===toward?1:.75)}
      else{if(f.state!=='idle')setState(f,'idle');f.vx=0}
    }
  }
  switch(f.state){
    case 'jump':
      if(f.buf&&!f.airUsed&&f.buf.b!=='s'){f.atk=ATK[f.buf.b==='p'?'jpunch':'jkick'];f.hitDone=false;f.ast=0;f.airUsed=true;f.atkId++;f.buf=null;sfx('whoosh')}

/* ---------- Collision ---------- */
const ov=(a,b)=>a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hurt(f){
  if(f.inv>0||['down','rise','ko','fall'].includes(f.state))return null;
  const s=f.s;let y=-46,h=46;
  if(f.state==='crouch'||(f.state==='attack'&&f.atk&&f.atk.crouch)||(f.state==='guard'&&f.cg)){y=-30;h=30}
  if(f.y<FLOOR){y=-44;h=36}
  return{x:f.x-9*s,y:f.y+y*s,w:18*s,h:h*s};
}
function hitbox(f){
  const A=f.atk;if(!A||!A.box||f.hitDone)return null;
  const t=A.air?f.ast:f.st;if(t<A.su||t>=A.su+A.ac)return null;

function applyHit(att,def,A,srcX,isProj,cx,cy){

  const canBlock=def.y>=FLOOR&&['idle','walk','crouch','guard'].includes(def.state)&&back;
  if(canBlock&&(A.h==='mid'||(A.h==='low'&&low)||(A.h==='high'&&!low))){
    setState(def,'guard');def.stun=A.bs;def.cg=low;def.vx=dir*A.push*1.1;
    if(isProj||A.kind)def.hp=Math.max(1,def.hp-2);

    hitstop=4;spark(cx,cy,6,['#bfe9ff','#ffffff']);sfx('block');return;
  }
  const sc=Math.max(.5,1-att.combo*.12),dmg=Math.max(1,Math.round(A.dmg*att.def.power*sc));
  def.hp=Math.max(0,def.hp-dmg);att.combo++;
  if(att.combo>=2)game.combo={side:att.side,n:att.combo,t:60};
  att.meter=Math.min(100,att.meter+8);def.meter=Math.min(100,def.meter+5);
  def.flash=4;def.atk=null;def.buf=null;game.hype=Math.min(120,game.hype+25+dmg*2);
  if(A.kd||def.y<FLOOR||def.hp<=0){setState(def,'fall');def.vy=-3.6;def.vx=dir*2.2;if(def.y>=FLOOR)def.y=FLOOR-1}
  else{setState(def,'hit');def.stun=A.hs;def.vx=dir*A.push}
  const big=dmg>=9;hitstop=big?8:5;shake=big?5:3;sfx(big?'hit2':'hit');
  spark(cx,cy,big?14:9,['#fff6c9',C.gold,C.hot]);if(big)ring(cx,cy,'#fff6c9');
  if(def.hp<=0)startKO(att);
}
function collide(){
  for(const att of F){const def=att===F[0]?F[1]:F[0];const hb=hitbox(att),hu=hurt(def);
    if(ov(hb,hu)){att.hitDone=true;applyHit(att,def,att.atk,att.x,false,(Math.max(hb.x,hu.x)+Math.min(hb.x+hb.w,hu.x+hu.w))/2,(Math.max(hb.y,hu.y)+Math.min(hb.y+hb.h,hu.y+hu.h))/2)}}
  for(const p of projs){if(p.dead)continue;
    for(const q of projs)if(q!==p&&!q.dead&&q.owner!==p.owner&&ov(projBox(p),projBox(q))){p.dead=q.dead=true;spark((p.x+q.x)/2,p.y-6,12,[C.ink,C.gold]);sfx('block')}
    if(p.dead)continue;
    const def=p.owner===F[0]?F[1]:F[0],hu=hurt(def),pb=projBox(p);
    if(ov(pb,hu)){p.dead=true;applyHit(p.owner,def,p,p.x-p.vx*4,true,p.x,pb.y+pb.h/2)}}

/* ---------- AI ---------- */
class AI{
  constructor(lv){this.lv=lv;this.L=[{re:[26,44],bl:.22,ag:.4},{re:[12,26],bl:.5,ag:.6},{re:[4,12],bl:.82,ag:.78}][lv];this.cd=30;this.at=0;this.hold={};this.tk=null}
  doit(h,t){this.hold=h;this.at=Math.round(t)}
  get(me,op){
    const o={l:0,r:0,u:0,d:0,p:0,k:0,s:0},tw=op.x>me.x?'r':'l',bk=tw==='r'?'l':'r',d=Math.abs(op.x-me.x);
    let tk=null,tl=false;
    if(op.atk&&(op.state==='attack'||op.state==='jump')&&d<70){tk='a'+op.atkId;tl=op.atk.h==='low'}
    else if(op.state==='jump'&&op.vy>0&&d<70)tk='j'+op.jumpId;
    for(const p of projs)if(p.owner===op&&Math.sign(me.x-p.x)===Math.sign(p.vx)&&Math.abs(me.x-p.x)<95){tk='p'+p.id;tl=p.h==='low'}
    if(tk&&FREE.concat(['guard']).includes(me.state)){
      if(this.tk!==tk){this.tk=tk;this.tb=Math.random()<this.L.bl;this.tj=tk[0]==='p'&&Math.random()<.18*this.lv}
      if(this.tj){o.u=1;o[tw]=1;return o}
      if(this.tb){o[bk]=1;if(tl)o.d=1;return o}
    }
    if(me.state==='jump'&&!me.airUsed&&me.vy>-1&&d<52){o[Math.random()<.6?'k':'p']=1;return o}
    if(op.state==='hit'&&d<40&&Math.random()<.12*this.lv){o.p=1;return o}
    if(this.at>0){this.at--;return Object.assign(o,this.hold)}
    if(this.cd>0){this.cd--;return o}
    this.cd=Math.round(rnd(...this.L.re));
    const r=Math.random(),ag=this.L.ag;
    if(['fall','down','rise'].includes(op.state)){this.doit({[bk]:1},8);return o}
    if(d>110){if(me.meter>=50&&r<.18+.2*ag)o.s=1;else this.doit({[tw]:1},rnd(18,40))}
    else if(d>42){
      if(r<ag*.55)this.doit({[tw]:1},rnd(10,20));
      else if(r<ag*.55+.12)this.doit({u:1,[tw]:1},3);
      else if(r<ag*.55+.24&&me.meter>=50)o.s=1;
      else this.doit({[bk]:1},rnd(8,16));
    }else{
      if(r<ag*.4)o.p=1;else if(r<ag*.72)o.k=1;else if(r<ag*.9){o.d=1;o.k=1}
      else if(r<.93)this.doit({[bk]:1},12);else this.doit({d:1},10);
    }
    return o;
  }
}

/* ---------- Input ---------- */
const KH={l:0,r:0,u:0,d:0},TH={l:0,r:0,u:0,d:0},PR={p:0,k:0,s:0};
function humanInput(){return{l:+(KH.l||TH.l),r:+(KH.r||TH.r),u:+(KH.u||TH.u),d:+(KH.d||TH.d),p:PR.p,k:PR.k,s:PR.s}}
const NONE={l:0,r:0,u:0,d:0,p:0,k:0,s:0};
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};

  ainit();

  if(e.repeat)return;
  const m=game.mode,ok=e.code==='Enter'||e.code==='Space';

addEventListener('blur',()=>{KH.l=KH.r=KH.u=KH.d=0;TH.l=TH.r=TH.u=TH.d=0});

/* ---------- Flow ---------- */
function setMode(m){game.mode=m;document.body.dataset.mode=m}
function startMatch(){
  sfx('go');
  const others=[0,1,2].filter(i=>i!==game.sel),o=others[Math.random()*2|0];
  F=[new Fighter(ROSTER[game.sel],0,false),new Fighter(ROSTER[o],1,true)];
  ai=new AI(game.diff);game.round=1;startRound();
}
function startRound(){for(const f of F)f.reset();projs=[];parts=[];game.timer=99*60;game.it=0;game.combo=null;game.winner=null;game.timeUp=false;setMode('intro')}

function timeUp(){const a=F[0].hp/F[0].maxhp,b=F[1].hp/F[1].maxhp;game.winner=a===b?null:a>b?F[0]:F[1];game.timeUp=true;game.kt=0;setMode('ko');sfx('bell')}

function resume(){sfx('sel');setMode(game.prev)}

function step(){
  fr++;
  const m=game.mode;
  if(m==='intro'||m==='fight'||m==='ko'){
    if(hitstop>0){hitstop--;return}
    if(m==='ko'&&game.kt<50&&!game.timeUp&&fr%2)return;
    const live=m==='fight';
    F[0].inp=live?humanInput():NONE;
    F[1].inp=live?ai.get(F[1],F[0]):NONE;
    updateFighter(F[0],F[1]);updateFighter(F[1],F[0]);
    for(const f of F){const o=f===F[0]?F[1]:F[0];if(FREE.includes(f.state)||f.state==='rise')o.combo=0}
    const a=F[0],b=F[1],dx=b.x-a.x;
    if(Math.abs(dx)<20&&Math.abs(a.y-b.y)<34){const o=(20-Math.abs(dx))/2,d=Math.sign(dx)||a.face;a.x-=d*o;b.x+=d*o}
    const maxd=W-40;if(Math.abs(b.x-a.x)>maxd){const ex=(Math.abs(b.x-a.x)-maxd)/2,d=Math.sign(b.x-a.x);a.x+=d*ex;b.x-=d*ex}
    for(const f of F)f.x=clamp(f.x,14,SW-14);
    for(const p of projs){p.x+=p.vx;p.t++;p.life--;if(p.life<=0||p.x<-20||p.x>SW+20)p.dead=true;
      if(p.kind==='fireball'&&p.t%2===0)parts.push({x:p.x-p.vx*2,y:p.y+rnd(-3,3),vx:-p.vx*.2,vy:rnd(-.3,.3),l:12,c:p.owner.def.fx[p.t%4?0:1],g:0,s:2});
      if(p.kind==='quake'&&p.t%3===0)dust(p.x,FLOOR,1)}
    projs=projs.filter(p=>!p.dead);
    if(m==='fight'){collide();if(--game.timer<=0)timeUp()}
    if(m==='intro'){game.it++;if(game.it===2)sfx('bell');if(game.it===70)sfx('go');if(game.it>=110)setMode('fight')}
    if(m==='ko'){game.kt++;
      if(game.kt===100){if(game.winner){game.winner.wins++;if(game.winner.hp>0){setState(game.winner,'win');game.winner.atk=null}}}
      if(game.kt>=210){const w=F.find(f=>f.wins>=2);if(w||game.round>=5)setMode('over');else{game.round++;startRound()}}}
    if(game.combo&&--game.combo.t<=0)game.combo=null;
  }
  for(const p of parts){if(p.ring){p.r+=1.6}else{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy}p.l--}
  parts=parts.filter(p=>p.l>0);
  if(shake>0)shake-=.5;if(game.hype>0)game.hype-=.4;
  PR.p=PR.k=PR.s=0;
}

function drawShadow(f){const sx=f.x-camX,k=clamp(1-(FLOOR-f.y)/80,.4,1),w=Math.round(26*k*f.s);R(sx-w/2,FLOOR,w,2,'rgba(10,6,14,.55)');R(sx-w/2+3,FLOOR+2,w-6,1,'rgba(10,6,14,.35)')}
function poseOf(f){
  const st=f.st;f.vflip=false;
  switch(f.state){
    case 'idle':return Math.floor(f.t/14)%2?shiftY(PO.idle,1):PO.idle;
    case 'walk':return lerpP(PO.walkA,PO.walkB,(Math.sin(f.t*.2)+1)/2);
    case 'crouch':return PO.crouch;
    case 'land':return lerpP(PO.crouch,PO.idle,st/5);
    case 'jump':if(f.atk){const A=f.atk;return f.ast<A.su?lerpP(PO.jump,PO[A.pose],f.ast/A.su):PO[A.pose]}return PO.jump;
    case 'attack':{const A=f.atk;if(!A)return PO.idle;
      if(A.kind==='fireball')return st<A.su?lerpP(PO.idle,PO.charge,st/A.su):st<A.su+8?PO.special:lerpP(PO.special,PO.idle,(st-A.su-8)/(A.re-8));
      if(A.kind==='quake')return st<A.su?lerpP(PO.idle,PO.slamUp,st/(A.su*.6)):st<A.su+10?PO.slamDown:lerpP(PO.slamDown,PO.idle,(st-A.su-10)/(A.re-10));
      if(A.kind==='dash'){if(st<A.su)return lerpP(PO.idle,PO.crouch,st/A.su);if(st<A.su+A.ac){f.vflip=Math.floor(st/4)%2===1;return PO.kick}return lerpP(PO.kick,PO.idle,(st-A.su-A.ac)/A.re)}
      const base=PO[A.base],ext=PO[A.pose];
      if(st<A.su)return lerpP(base,ext,st/A.su*.5);if(st<A.su+A.ac)return ext;return lerpP(ext,base,(st-A.su-A.ac)/A.re);}
    case 'guard':return f.cg?PO.cguard:PO.guard;
    case 'hit':return lerpP(PO.hit,PO.idle,(st-f.stun*.6)/(f.stun*.4));
    case 'fall':return PO.fall;
    case 'down':case 'ko':return PO.down;
    case 'rise':return lerpP(PO.down,PO.crouch,st/14);
    case 'win':return Math.floor(f.t/20)%2?shiftY(PO.win,1):PO.win;
  }
  return PO.idle;
}

/* ---------- Layout ---------- */
function fit(){
  const app=$('#app'),cs=getComputedStyle(app);
  const vw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),vh=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const portrait=vh>vw*1.1;document.body.classList.toggle('portrait',portrait);
  let sc=portrait?vw/W:Math.min(vw/W,vh/H);if(sc>=2&&!portrait)sc=Math.floor(sc*2)/2;
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
fit();

/* ---------- Loop ---------- */
const bS=$('#bS');let acc=0,last=performance.now(),lastReady=null;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){if(game.mode!=='pause')step();acc-=1000/60}
  render();
  const ready=F.length===2&&F[0].meter>=50;if(ready!==lastReady){bS.classList.toggle('ready',ready);lastReady=ready}
  requestAnimationFrame(frame);
}

const boot=()=>{buildBG();requestAnimationFrame(frame)};
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(boot,boot);
