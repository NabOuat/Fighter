# Configuration du salon en ligne (Cloudflare Workers, plan gratuit).
# Publier : npx wrangler login (une seule fois), puis npx wrangler deploy
name = "legendz-lobby"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Les salles de jeu : un Durable Object par code de salle.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Stockage SQLite : le seul disponible sur le plan gratuit.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
